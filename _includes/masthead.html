{% include base_path %}

<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a class="site-nav__brand" href="{{ base_path }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.title }}</a>
        <button id="site-nav-toggle" type="button" aria-controls="site-nav-links" aria-expanded="false">
          <span class="navicon" aria-hidden="true"></span>
          <span class="visually-hidden">Toggle navigation</span>
        </button>
        <ul id="site-nav-links" class="site-nav__links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>
